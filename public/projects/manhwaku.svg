<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <clipPath id="clip"><rect width="800" height="500" rx="8"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <!-- Background -->
    <rect width="800" height="500" fill="#0c0a09"/>

    <!-- Top bar -->
    <rect width="800" height="40" fill="#1c1917"/>
    <line x1="0" y1="40" x2="800" y2="40" stroke="#292524" stroke-width="1"/>
    <circle cx="16" cy="20" r="5" fill="#ef4444"/>
    <circle cx="34" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="20" r="5" fill="#22c55e"/>
    <text x="400" y="25" fill="#e7e5e4" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle" font-weight="600">ManhwaKu — Modern Webtoon &amp; Manga Reader</text>

    <!-- Header bar -->
    <rect x="0" y="40" width="800" height="56" fill="#141210"/>
    <line x1="0" y1="96" x2="800" y2="96" stroke="#292524" stroke-width="1"/>

    <!-- App Logo -->
    <rect x="24" y="54" width="28" height="28" rx="6" fill="#f59e0b"/>
    <text x="38" y="73" font-family="ui-monospace, monospace" font-size="14" font-weight="800" fill="#0c0a09" text-anchor="middle">M</text>
    <text x="62" y="73" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f5f5f4">Manhwa<tspan fill="#f59e0b">Ku</tspan></text>

    <!-- Source Selector Dropdown Pill with Live Dot -->
    <rect x="520" y="54" width="130" height="28" rx="7" fill="#1c1917" stroke="#292524"/>
    <circle cx="534" cy="68" r="4" fill="#22c55e"/>
    <text x="546" y="72" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#e7e5e4">Shinigami (ID)</text>

    <!-- Health Monitor Button -->
    <rect x="658" y="54" width="28" height="28" rx="7" fill="#1c1917" stroke="#292524"/>
    <path d="M 664 68 L 668 68 L 671 62 L 674 74 L 677 65 L 680 68 L 682 68" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>

    <!-- User Profile Button -->
    <rect x="694" y="54" width="82" height="28" rx="7" fill="#1c1917" stroke="#292524"/>
    <text x="735" y="72" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f59e0b" text-anchor="middle">Amed</text>

    <!-- Continue Reading Banner -->
    <rect x="24" y="112" width="752" height="68" rx="12" fill="#1c1917" stroke="#41372e"/>
    <rect x="36" y="122" width="34" height="48" rx="6" fill="#292524"/>
    <text x="53" y="151" font-family="ui-monospace, monospace" font-size="11" fill="#a8a29e" text-anchor="middle">IMG</text>
    <text x="82" y="138" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f5f5f4">LANJUTKAN BACA: Solo Leveling</text>
    <text x="82" y="156" font-family="system-ui, sans-serif" font-size="11" fill="#f59e0b">Chapter 179 • Panel 14 / 28</text>
    <rect x="668" y="130" width="96" height="32" rx="8" fill="#f59e0b"/>
    <text x="716" y="150" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0c0a09" text-anchor="middle">Lanjut Baca ▶</text>

    <!-- Manga Grid: 4 Cards -->
    <!-- Card 1 -->
    <rect x="24" y="198" width="176" height="280" rx="12" fill="#141210" stroke="#292524"/>
    <rect x="36" y="210" width="152" height="190" rx="8" fill="#292524"/>
    <rect x="44" y="218" width="60" height="20" rx="4" fill="#0c0a09" fill-opacity="0.8"/>
    <text x="74" y="232" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#22c55e" text-anchor="middle">CH. 214</text>
    <text x="36" y="420" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f5f5f4">Eleceed</text>
    <text x="36" y="438" font-family="system-ui, sans-serif" font-size="10" fill="#a8a29e">Action, Super Power</text>

    <!-- Card 2 -->
    <rect x="216" y="198" width="176" height="280" rx="12" fill="#141210" stroke="#292524"/>
    <rect x="228" y="210" width="152" height="190" rx="8" fill="#292524"/>
    <rect x="236" y="218" width="60" height="20" rx="4" fill="#0c0a09" fill-opacity="0.8"/>
    <text x="266" y="232" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#22c55e" text-anchor="middle">CH. 195</text>
    <text x="228" y="420" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f5f5f4">Nano Machine</text>
    <text x="228" y="438" font-family="system-ui, sans-serif" font-size="10" fill="#a8a29e">Murim, Sci-Fi</text>

    <!-- Card 3 -->
    <rect x="408" y="198" width="176" height="280" rx="12" fill="#141210" stroke="#292524"/>
    <rect x="420" y="210" width="152" height="190" rx="8" fill="#292524"/>
    <rect x="428" y="218" width="60" height="20" rx="4" fill="#0c0a09" fill-opacity="0.8"/>
    <text x="458" y="232" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#22c55e" text-anchor="middle">CH. 142</text>
    <text x="420" y="420" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f5f5f4">The World's Best Eng...</text>
    <text x="420" y="438" font-family="system-ui, sans-serif" font-size="10" fill="#a8a29e">Comedy, Fantasy</text>

    <!-- Card 4 -->
    <rect x="600" y="198" width="176" height="280" rx="12" fill="#141210" stroke="#292524"/>
    <rect x="612" y="210" width="152" height="190" rx="8" fill="#292524"/>
    <rect x="620" y="218" width="60" height="20" rx="4" fill="#0c0a09" fill-opacity="0.8"/>
    <text x="650" y="232" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#22c55e" text-anchor="middle">CH. 188</text>
    <text x="612" y="420" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f5f5f4">Return of the Disas...</text>
    <text x="612" y="438" font-family="system-ui, sans-serif" font-size="10" fill="#a8a29e">Action, Fantasy</text>
  </g>
</svg>
