    <text x="298" y="184" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f5f5f4">Sate Maranggi Ciganjur</text>
    <text x="298" y="202" font-family="system-ui, sans-serif" font-size="10" fill="#a8a29e">Resto Keluarga • Ciganjur</text>
    <rect x="298" y="214" width="46" height="18" rx="4" fill="#f59e0b" fill-opacity="0.15"/>
    <text x="321" y="227" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#f59e0b" text-anchor="middle">★ 4.7</text>
    <text x="352" y="227" font-family="system-ui, sans-serif" font-size="10" fill="#78716c">(890 ulasan)</text>
    <text x="298" y="254" font-family="system-ui, sans-serif" font-size="10" fill="#78716c">Jl. Brigif No. 12 • ~1.2 km</text>
    <rect x="298" y="268" width="80" height="22" rx="5" fill="#292524"/>
    <text x="338" y="283" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#f59e0b" text-anchor="middle">Buka GMaps ↗</text>

    <!-- Card 3 -->
    <rect x="540" y="156" width="236" height="150" rx="12" fill="#1c1917" stroke="#292524"/>
    <text x="556" y="184" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f5f5f4">Bakso Titoti Pasar Minggu</text>
    <text x="556" y="202" font-family="system-ui, sans-serif" font-size="10" fill="#a8a29e">Kuliner Legendaris • Pasar Minggu</text>
    <rect x="556" y="214" width="46" height="18" rx="4" fill="#f59e0b" fill-opacity="0.15"/>
    <text x="579" y="227" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#f59e0b" text-anchor="middle">★ 4.8</text>
    <text x="610" y="227" font-family="system-ui, sans-serif" font-size="10" fill="#78716c">(3.100 ulasan)</text>
    <text x="556" y="254" font-family="system-ui, sans-serif" font-size="10" fill="#78716c">Jl. Raya Pasar Minggu • ~3.5 km</text>
    <rect x="556" y="268" width="80" height="22" rx="5" fill="#292524"/>
    <text x="596" y="283" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#f59e0b" text-anchor="middle">Buka GMaps ↗</text>

    <!-- Bottom Scraper Pipeline Stats -->
    <rect x="24" y="324" width="752" height="150" rx="12" fill="#141210" stroke="#292524"/>
    <text x="40" y="352" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f5f5f4">Scraper Pipeline &amp; SQLite Synchronization</text>
    <text x="40" y="372" font-family="system-ui, sans-serif" font-size="10" fill="#a8a29e">Playwright Stealth Feed Crawler • Rotasi Low-and-Slow (2 query per batch tiap 2 jam)</text>
    
    <rect x="40" y="390" width="220" height="64" rx="8" fill="#1c1917" stroke="#292524"/>
    <text x="56" y="412" font-family="system-ui, sans-serif" font-size="10" fill="#78716c">TOTAL TEMPAT MAKAN</text>
    <text x="56" y="438" font-family="ui-monospace, monospace" font-size="18" font-weight="700" fill="#22c55e">1.588</text>

    <rect x="280" y="390" width="220" height="64" rx="8" fill="#1c1917" stroke="#292524"/>
    <text x="296" y="412" font-family="system-ui, sans-serif" font-size="10" fill="#78716c">CAKUPAN KECAMATAN</text>
    <text x="296" y="438" font-family="ui-monospace, monospace" font-size="18" font-weight="700" fill="#f59e0b">8 Kecamatan</text>

    <rect x="520" y="390" width="236" height="64" rx="8" fill="#1c1917" stroke="#292524"/>
    <text x="536" y="412" font-family="system-ui, sans-serif" font-size="10" fill="#78716c">STORAGE &amp; QUERY ENGINE</text>
    <text x="536" y="438" font-family="ui-monospace, monospace" font-size="18" font-weight="700" fill="#38bdf8">SQLite WAL</text>
