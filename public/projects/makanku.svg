    <text x="40" y="202" font-family="system-ui, sans-serif" font-size="10" fill="#a8a29e">Cafe &amp; Coffee Shop • Jagakarsa</text>
    <rect x="40" y="214" width="46" height="18" rx="4" fill="#f59e0b" fill-opacity="0.15"/>
    <text x="63" y="227" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#f59e0b" text-anchor="middle">★ 4.6</text>
    <text x="94" y="227" font-family="system-ui, sans-serif" font-size="10" fill="#78716c">(1.240 ulasan)</text>
    <text x="40" y="254" font-family="system-ui, sans-serif" font-size="10" fill="#78716c">Jl. Moh. Kahfi 1 No. 8 • ~0.8 km</text>
    <rect x="40" y="268" width="80" height="22" rx="5" fill="#292524"/>
    <text x="80" y="283" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#f59e0b" text-anchor="middle">Buka GMaps ↗</text>

