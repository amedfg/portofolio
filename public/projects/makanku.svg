<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <clipPath id="clip"><rect width="800" height="500" rx="8"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <!-- Background -->
    <rect width="800" height="500" fill="#0c0a09"/>

    <!-- Top bar -->
    <rect width="800" height="40" fill="#1c1917"/>
    <line x1="0" y1="40" x2="800" y2="40" stroke="#292524" stroke-width="1"/>
    <circle cx="16" cy="20" r="5" fill="#ef4444"/>
    <circle cx="34" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="20" r="5" fill="#22c55e"/>
    <text x="400" y="25" fill="#e7e5e4" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle" font-weight="600">MakanKu — Jakarta Selatan Culinary Curator (1,500+ Spots)</text>

    <!-- Header bar -->
    <rect x="0" y="40" width="800" height="56" fill="#141210"/>
    <line x1="0" y1="96" x2="800" y2="96" stroke="#292524" stroke-width="1"/>

    <!-- App Logo -->
    <rect x="24" y="54" width="28" height="28" rx="6" fill="#f59e0b"/>
    <text x="38" y="73" font-family="ui-monospace, monospace" font-size="14" font-weight="800" fill="#0c0a09" text-anchor="middle">M</text>
    <text x="62" y="73" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f5f5f4">Makan<tspan fill="#f59e0b">Ku</tspan></text>

    <!-- Search Input in Header -->
    <rect x="180" y="52" width="340" height="32" rx="8" fill="#1c1917" stroke="#292524"/>
    <text x="198" y="72" font-family="system-ui, sans-serif" font-size="11" fill="#78716c">🔍 Cari kuliner, kopi, atau warung di Jaksel...</text>

    <!-- Scraper Counter Pill -->
    <rect x="620" y="52" width="156" height="32" rx="8" fill="#1c1917" stroke="#292524"/>
    <circle cx="636" cy="68" r="4" fill="#22c55e"/>
    <text x="648" y="72" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#f59e0b">1.588 Tempat Makan</text>

    <!-- Kecamatan Filter Chips -->
    <rect x="24" y="112" width="70" height="28" rx="7" fill="#f59e0b"/>
    <text x="59" y="130" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0c0a09" text-anchor="middle">Semua</text>

    <rect x="102" y="112" width="88" height="28" rx="7" fill="#1c1917" stroke="#292524"/>
    <text x="146" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#e7e5e4" text-anchor="middle">Jagakarsa</text>

    <rect x="198" y="112" width="104" height="28" rx="7" fill="#1c1917" stroke="#292524"/>
    <text x="250" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#e7e5e4" text-anchor="middle">Pasar Minggu</text>

    <rect x="310" y="112" width="84" height="28" rx="7" fill="#1c1917" stroke="#292524"/>
    <text x="352" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#e7e5e4" text-anchor="middle">Cilandak</text>

