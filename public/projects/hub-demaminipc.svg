<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <clipPath id="clip"><rect width="800" height="500" rx="8"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <!-- Background -->
    <rect width="800" height="500" fill="#0c0a09"/>

    <!-- Top window bar -->
    <rect width="800" height="40" fill="#1c1917"/>
    <line x1="0" y1="40" x2="800" y2="40" stroke="#292524" stroke-width="1"/>
    <circle cx="16" cy="20" r="5" fill="#ef4444"/>
    <circle cx="34" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="20" r="5" fill="#22c55e"/>
    <text x="400" y="25" fill="#e7e5e4" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle" font-weight="600">Dema MiniPC Hub — Hardware Telemetry &amp; Infra Mesh</text>

    <!-- Top Sub-header / Host info -->
    <rect x="0" y="40" width="800" height="42" fill="#141210"/>
    <line x1="0" y1="82" x2="800" y2="82" stroke="#292524" stroke-width="1"/>
    <circle cx="24" cy="61" r="4" fill="#22c55e"/>
    <text x="36" y="65" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#f59e0b">minipc-edge-01</text>
    <text x="140" y="65" font-family="system-ui, sans-serif" font-size="11" fill="#78716c">Ubuntu 24.04 LTS • Linux 6.8.0 • Uptime 9d 14h</text>
    
    <rect x="626" y="48" width="150" height="26" rx="6" fill="#1c1917" stroke="#292524"/>
    <circle cx="638" cy="61" r="3.5" fill="#22c55e"/>
    <text x="648" y="65" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#e7e5e4">Cloudflare Ingress Active</text>

    <!-- 4 Telemetry Metrics Cards -->
    <!-- Card 1: CPU -->
    <rect x="24" y="96" width="176" height="78" rx="10" fill="#1c1917" stroke="#292524"/>
    <text x="38" y="118" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#78716c" letter-spacing="0.5">CPU LOAD &amp; TEMP</text>
    <text x="38" y="146" font-family="ui-monospace, monospace" font-size="20" font-weight="800" fill="#f5f5f4">18.4<tspan font-size="13" fill="#a8a29e">%</tspan></text>
    <rect x="136" y="128" width="50" height="20" rx="4" fill="#292524"/>
    <text x="161" y="142" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#f59e0b" text-anchor="middle">44°C</text>

    <!-- Card 2: Power (RAPL) -->
    <rect x="212" y="96" width="176" height="78" rx="10" fill="#1c1917" stroke="#41372e"/>
    <text x="226" y="118" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#f59e0b" letter-spacing="0.5">INTEL RAPL POWER</text>
    <text x="226" y="146" font-family="ui-monospace, monospace" font-size="20" font-weight="800" fill="#f59e0b">11.8<tspan font-size="13" fill="#fbbf24">W</tspan></text>
    <text x="226" y="162" font-family="system-ui, sans-serif" font-size="9" fill="#78716c">package-0 sysfs live</text>

    <!-- Card 3: Memory -->
    <rect x="400" y="96" width="184" height="78" rx="10" fill="#1c1917" stroke="#292524"/>
    <text x="414" y="118" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#78716c" letter-spacing="0.5">RAM ALLOCATION</text>
    <text x="414" y="146" font-family="ui-monospace, monospace" font-size="20" font-weight="800" fill="#f5f5f4">7.1<tspan font-size="13" fill="#a8a29e">/16 GB</tspan></text>
    <text x="414" y="162" font-family="system-ui, sans-serif" font-size="9" fill="#22c55e">✓ 44.3% Safe Buffer</text>

    <!-- Card 4: Services Online -->
    <rect x="596" y="96" width="180" height="78" rx="10" fill="#1c1917" stroke="#292524"/>
    <text x="610" y="118" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#78716c" letter-spacing="0.5">MESH HEALTH</text>
    <text x="610" y="146" font-family="ui-monospace, monospace" font-size="20" font-weight="800" fill="#22c55e">8 / 8<tspan font-size="12" fill="#78716c"> up</tspan></text>
    <text x="610" y="162" font-family="system-ui, sans-serif" font-size="9" fill="#78716c">0 incidents past 30d</text>

    <!-- Section 1: Services Grid (Left Column) -->
    <rect x="24" y="188" width="446" height="286" rx="12" fill="#141210" stroke="#292524"/>
    <text x="40" y="212" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a8a29e" letter-spacing="0.5">DEPLOYED PRODUCTION SERVICES</text>

    <!-- Service Row 1: ChatKu -->
    <rect x="36" y="224" width="422" height="42" rx="8" fill="#1c1917" stroke="#292524"/>
    <circle cx="52" cy="245" r="4" fill="#22c55e"/>
    <text x="66" y="248" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f5f5f4">ChatKu</text>
    <text x="120" y="248" font-family="ui-monospace, monospace" font-size="10" fill="#78716c">:3010 • Docker</text>
    <rect x="350" y="234" width="96" height="22" rx="5" fill="#292524"/>
    <text x="398" y="249" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#22c55e" text-anchor="middle">ONLINE 24ms</text>

    <!-- Service Row 2: DuitKu -->
    <rect x="36" y="272" width="422" height="42" rx="8" fill="#1c1917" stroke="#292524"/>
    <circle cx="52" cy="293" r="4" fill="#22c55e"/>
    <text x="66" y="296" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f5f5f4">DuitKu</text>
    <text x="120" y="296" font-family="ui-monospace, monospace" font-size="10" fill="#78716c">:3030 • systemd</text>
    <rect x="350" y="282" width="96" height="22" rx="5" fill="#292524"/>
    <text x="398" y="297" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#22c55e" text-anchor="middle">ACTIVE 12ms</text>

    <!-- Service Row 3: MakanKu -->
    <rect x="36" y="320" width="422" height="42" rx="8" fill="#1c1917" stroke="#292524"/>
    <circle cx="52" cy="341" r="4" fill="#22c55e"/>
    <text x="66" y="344" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f5f5f4">MakanKu</text>
    <text x="130" y="344" font-family="ui-monospace, monospace" font-size="10" fill="#78716c">:3040 • Crawler 2h</text>
    <rect x="350" y="330" width="96" height="22" rx="5" fill="#292524"/>
    <text x="398" y="345" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#22c55e" text-anchor="middle">ACTIVE 16ms</text>

    <!-- Service Row 4: ManhwaKu -->
    <rect x="36" y="368" width="422" height="42" rx="8" fill="#1c1917" stroke="#292524"/>
    <circle cx="52" cy="389" r="4" fill="#22c55e"/>
    <text x="66" y="392" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f5f5f4">ManhwaKu</text>
    <text x="142" y="392" font-family="ui-monospace, monospace" font-size="10" fill="#78716c">:3020 • Turbo CDN</text>
    <rect x="350" y="378" width="96" height="22" rx="5" fill="#292524"/>
    <text x="398" y="393" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#22c55e" text-anchor="middle">ONLINE 32ms</text>

    <!-- Service Row 5: 9Router -->
    <rect x="36" y="416" width="422" height="42" rx="8" fill="#1c1917" stroke="#292524"/>
    <circle cx="52" cy="437" r="4" fill="#22c55e"/>
    <text x="66" y="440" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f5f5f4">9Router Gateway</text>
    <text x="180" y="440" font-family="ui-monospace, monospace" font-size="10" fill="#78716c">:20128 • LLM Mesh</text>
    <rect x="350" y="426" width="96" height="22" rx="5" fill="#292524"/>
    <text x="398" y="441" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#22c55e" text-anchor="middle">READY</text>

    <!-- Section 2: Automated Reliability & Watchdog (Right Column) -->
    <rect x="482" y="188" width="294" height="286" rx="12" fill="#141210" stroke="#292524"/>
    <text x="498" y="212" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a8a29e" letter-spacing="0.5">AUTOMATED RELIABILITY</text>

    <!-- Backup Widget -->
    <rect x="496" y="224" width="266" height="116" rx="8" fill="#1c1917" stroke="#292524"/>
    <text x="510" y="246" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f5f5f4">Nightly Backup Engine</text>
    <rect x="686" y="234" width="64" height="18" rx="4" fill="#22c55e" fill-opacity="0.15"/>
    <text x="718" y="247" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#22c55e" text-anchor="middle">03:00 WIB</text>
    
    <text x="510" y="268" font-family="ui-monospace, monospace" font-size="10" fill="#a8a29e">Target: SQLite Online Vacuum</text>
    <text x="510" y="284" font-family="ui-monospace, monospace" font-size="10" fill="#a8a29e">Schedule: minipc-backup.timer</text>
    <text x="510" y="300" font-family="ui-monospace, monospace" font-size="10" fill="#a8a29e">Retention: 7-day rolling cycle</text>
    <text x="510" y="324" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#22c55e">✓ Last Backup Succeeded (0 Errors)</text>

    <!-- Server Watchdog Widget -->
    <rect x="496" y="350" width="266" height="108" rx="8" fill="#1c1917" stroke="#292524"/>
    <text x="510" y="372" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f5f5f4">Server Watchdog System</text>
    <rect x="686" y="360" width="64" height="18" rx="4" fill="#f59e0b" fill-opacity="0.15"/>
    <text x="718" y="373" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#f59e0b" text-anchor="middle">5m TICK</text>

    <text x="510" y="394" font-family="ui-monospace, monospace" font-size="10" fill="#a8a29e">Timer: server-watchdog.timer</text>
    <text x="510" y="410" font-family="ui-monospace, monospace" font-size="10" fill="#a8a29e">Alert: @demawatchdogsbot</text>
    <text x="510" y="438" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#22c55e">✓ Zero Packet Loss • All Ports Responding</text>
  </g>
