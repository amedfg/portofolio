  <!-- Code content -->
  <text x="48" y="72" font-family="ui-monospace,monospace" font-size="11" fill="#78716c">import tensorflow as tf</text>
  <text x="48" y="90" font-family="ui-monospace,monospace" font-size="11" fill="#78716c">from tensorflow.keras.applications import ResNet50</text>
  <text x="48" y="108" font-family="ui-monospace,monospace" font-size="11" fill="#78716c">import numpy as np</text>
  <text x="48" y="126" font-family="ui-monospace,monospace" font-size="11" fill="#e7e5e4"> </text>
  <text x="48" y="144" font-family="ui-monospace,monospace" font-size="11"><tspan fill="#f59e0b">model</tspan><tspan fill="#e7e5e4"> = ResNet50(</tspan><tspan fill="#a8a29e">weights</tspan><tspan fill="#e7e5e4">=</tspan><tspan fill="#4ade80">'imagenet'</tspan><tspan fill="#e7e5e4">,</tspan></text>
  <text x="48" y="162" font-family="ui-monospace,monospace" font-size="11"><tspan fill="#e7e5e4">               </tspan><tspan fill="#a8a29e">include_top</tspan><tspan fill="#e7e5e4">=</tspan><tspan fill="#60a5fa">False</tspan><tspan fill="#e7e5e4">)</tspan></text>
  <text x="48" y="180" font-family="ui-monospace,monospace" font-size="11"><tspan fill="#f59e0b">model</tspan><tspan fill="#e7e5e4">.trainable = </tspan><tspan fill="#60a5fa">False</tspan></text>
  <text x="48" y="198" font-family="ui-monospace,monospace" font-size="11" fill="#e7e5e4"> </text>
  <text x="48" y="216" font-family="ui-monospace,monospace" font-size="11"><tspan fill="#f59e0b">x</tspan><tspan fill="#e7e5e4"> = GlobalAveragePooling2D()(</tspan><tspan fill="#f59e0b">model</tspan><tspan fill="#e7e5e4">.output)</tspan></text>
  <text x="48" y="234" font-family="ui-monospace,monospace" font-size="11"><tspan fill="#f59e0b">x</tspan><tspan fill="#e7e5e4"> = Dense(</tspan><tspan fill="#60a5fa">256</tspan><tspan fill="#e7e5e4">, activation=</tspan><tspan fill="#4ade80">'relu'</tspan><tspan fill="#e7e5e4">)(</tspan><tspan fill="#f59e0b">x</tspan><tspan fill="#e7e5e4">)</tspan></text>
  <text x="48" y="252" font-family="ui-monospace,monospace" font-size="11"><tspan fill="#f59e0b">x</tspan><tspan fill="#e7e5e4"> = Dropout(</tspan><tspan fill="#60a5fa">0.3</tspan><tspan fill="#e7e5e4">)(</tspan><tspan fill="#f59e0b">x</tspan><tspan fill="#e7e5e4">)</tspan></text>
  <text x="48" y="270" font-family="ui-monospace,monospace" font-size="11"><tspan fill="#f59e0b">output</tspan><tspan fill="#e7e5e4"> = Dense(</tspan><tspan fill="#60a5fa">1</tspan><tspan fill="#e7e5e4">, activation=</tspan><tspan fill="#4ade80">'sigmoid'</tspan><tspan fill="#e7e5e4">)(</tspan><tspan fill="#f59e0b">x</tspan><tspan fill="#e7e5e4">)</tspan></text>
  <text x="48" y="288" font-family="ui-monospace,monospace" font-size="11" fill="#e7e5e4"> </text>
  <text x="48" y="306" font-family="ui-monospace,monospace" font-size="11"><tspan fill="#f59e0b">clf</tspan><tspan fill="#e7e5e4"> = Model(</tspan><tspan fill="#f59e0b">model</tspan><tspan fill="#e7e5e4">.input, </tspan><tspan fill="#f59e0b">output</tspan><tspan fill="#e7e5e4">)</tspan></text>
  <text x="48" y="324" font-family="ui-monospace,monospace" font-size="11"><tspan fill="#f59e0b">clf</tspan><tspan fill="#e7e5e4">.compile(optimizer=</tspan><tspan fill="#4ade80">'adam'</tspan><tspan fill="#e7e5e4">,</tspan></text>
  <text x="48" y="342" font-family="ui-monospace,monospace" font-size="11"><tspan fill="#e7e5e4">           loss=</tspan><tspan fill="#4ade80">'binary_crossentropy'</tspan><tspan fill="#e7e5e4">,</tspan></text>
  <text x="48" y="360" font-family="ui-monospace,monospace" font-size="11"><tspan fill="#e7e5e4">           metrics=[</tspan><tspan fill="#4ade80">'accuracy'</tspan><tspan fill="#e7e5e4">])</tspan></text>

