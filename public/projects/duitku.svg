<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <clipPath id="clip"><rect width="800" height="500" rx="8"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <!-- Background -->
    <rect width="800" height="500" fill="#0c0a09"/>

    <!-- Top bar -->
    <rect width="800" height="40" fill="#1c1917"/>
    <line x1="0" y1="40" x2="800" y2="40" stroke="#292524" stroke-width="1"/>
    <circle cx="16" cy="20" r="5" fill="#ef4444"/>
    <circle cx="34" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="20" r="5" fill="#22c55e"/>
    <text x="400" y="25" fill="#e7e5e4" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle" font-weight="600">DuitKu — Personal Finance &amp; Cashflow Engine</text>

    <!-- Sidebar -->
    <rect x="0" y="40" width="200" height="460" fill="#141210"/>
    <line x1="200" y1="40" x2="200" y2="500" stroke="#292524" stroke-width="1"/>

    <!-- App Logo in Sidebar -->
    <rect x="18" y="58" width="28" height="28" rx="6" fill="#f59e0b"/>
    <text x="32" y="77" font-family="ui-monospace, monospace" font-size="14" font-weight="800" fill="#0c0a09" text-anchor="middle">D</text>
    <text x="56" y="77" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f5f5f4">Duit<tspan fill="#f59e0b">Ku</tspan></text>

    <!-- Cycle Selector Pill -->
    <rect x="16" y="104" width="168" height="34" rx="8" fill="#1c1917" stroke="#41372e"/>
    <text x="26" y="125" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#f59e0b">● SIKLUS AKTIF</text>
    <text x="174" y="125" font-family="system-ui, sans-serif" font-size="10" fill="#a8a29e" text-anchor="end">25 Okt – 24 Nov</text>

    <!-- Navigation items -->
    <rect x="12" y="152" width="176" height="32" rx="6" fill="#292524"/>
    <text x="28" y="172" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f5f5f4">Ringkasan Kas</text>

    <text x="28" y="206" font-family="system-ui, sans-serif" font-size="12" fill="#78716c">Kurva Arus Kas</text>
    <text x="28" y="238" font-family="system-ui, sans-serif" font-size="12" fill="#78716c">Matrix Kalender</text>
    <text x="28" y="270" font-family="system-ui, sans-serif" font-size="12" fill="#78716c">Daftar Transaksi</text>
    <text x="28" y="302" font-family="system-ui, sans-serif" font-size="12" fill="#78716c">Kategori &amp; Limit</text>

    <!-- Main Content Area -->
    <!-- Metric Cards Row -->
    <!-- Card 1: Sisa Kas -->
    <rect x="220" y="58" width="170" height="96" rx="12" fill="#1c1917" stroke="#292524"/>
    <text x="236" y="82" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#a8a29e">SISA KAS OPERASIONAL</text>
    <text x="236" y="114" font-family="ui-monospace, monospace" font-size="20" font-weight="700" fill="#f5f5f4">Rp 4.820.000</text>
    <text x="236" y="136" font-family="system-ui, sans-serif" font-size="10" fill="#22c55e">✓ Batas aman: Rp 241rb/hari</text>

    <!-- Card 2: Pengeluaran -->
    <rect x="406" y="58" width="170" height="96" rx="12" fill="#1c1917" stroke="#292524"/>
    <text x="422" y="82" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#a8a29e">TOTAL PENGELUARAN</text>
    <text x="422" y="114" font-family="ui-monospace, monospace" font-size="20" font-weight="700" fill="#f59e0b">Rp 2.680.000</text>
    <text x="422" y="136" font-family="system-ui, sans-serif" font-size="10" fill="#a8a29e">Rata-rata Rp 134rb/hari</text>

    <!-- Card 3: Tabungan -->
    <rect x="592" y="58" width="188" height="96" rx="12" fill="#1c1917" stroke="#292524"/>
    <text x="608" y="82" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#a8a29e">TABUNGAN &amp; INVESTASI</text>
    <text x="608" y="114" font-family="ui-monospace, monospace" font-size="20" font-weight="700" fill="#38bdf8">Rp 10.000.000</text>
    <text x="608" y="136" font-family="system-ui, sans-serif" font-size="10" fill="#38bdf8">+1.5jt siklus ini</text>

    <!-- Spline Curve Chart Area -->
    <rect x="220" y="170" width="560" height="180" rx="12" fill="#141210" stroke="#292524"/>
    <text x="236" y="196" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f5f5f4">Tren Pengeluaran Harian (Bézier Spline)</text>
    
    <!-- Chart Grid Lines -->
    <line x1="240" y1="230" x2="760" y2="230" stroke="#292524" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="240" y1="270" x2="760" y2="270" stroke="#292524" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="240" y1="310" x2="760" y2="310" stroke="#292524" stroke-width="1"/>

    <!-- Average benchmark line -->
    <line x1="240" y1="260" x2="760" y2="260" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>
    <text x="755" y="255" font-family="ui-monospace, monospace" font-size="9" fill="#f59e0b" text-anchor="end">Avg Rp 134k</text>

    <!-- Spline Curve fill & stroke -->
    <path d="M 250 310 Q 280 290, 310 300 T 370 240 T 430 280 T 490 220 T 550 290 T 610 260 T 670 210 T 730 290 L 730 310 Z" fill="#f59e0b" fill-opacity="0.1"/>
    <path d="M 250 310 Q 280 290, 310 300 T 370 240 T 430 280 T 490 220 T 550 290 T 610 260 T 670 210 T 730 290" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="670" cy="210" r="4" fill="#f59e0b"/>

    <!-- Bottom: Recent Transactions Ledger -->
    <rect x="220" y="366" width="560" height="114" rx="12" fill="#1c1917" stroke="#292524"/>
    <text x="236" y="388" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a8a29e">TRANSAKSI TERAKHIR</text>

    <!-- Row 1 -->
    <circle cx="248" cy="410" r="12" fill="#292524"/>
    <text x="268" y="414" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f5f5f4">Kopi &amp; Makan Siang</text>
    <text x="268" y="426" font-family="system-ui, sans-serif" font-size="9" fill="#78716c">Konsumsi • Ciganjur</text>
    <text x="760" y="414" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#f87171" text-anchor="end">-Rp 45.000</text>

    <!-- Row 2 -->
    <circle cx="248" cy="450" r="12" fill="#292524"/>
    <text x="268" y="454" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f5f5f4">Main Padel GSC</text>
    <text x="268" y="466" font-family="system-ui, sans-serif" font-size="9" fill="#78716c">Olahraga • South Jakarta</text>
    <text x="760" y="454" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#f87171" text-anchor="end">-Rp 47.000</text>
  </g>
</svg>
